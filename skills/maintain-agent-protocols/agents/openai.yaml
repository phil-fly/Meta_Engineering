interface:
  display_name: "维护 Agent 协作协议"
  short_description: "生成、审查、升级和维护 AGENTS/CLAUDE 协作协议、约束门禁、触发稳定性与工程规则路由"
  default_prompt: "使用 $maintain-agent-protocols 生成、维护、升级或审查我的 AI Agent 协作协议，按模型选择 AGENTS.md/CLAUDE.md，识别现有协议真值源，判断原则、约束、工作流、检查项和触发稳定性，把高频或高风险约束绑定到 WF-* 的预检门、变更门、验证门和报告门；只有目标仓存在真实前端实现时才创建或补齐详细 design-tokens.md，并要求 Agent 在前端设计和开发前读取、变更时同步，而不是用大量路由代替参数明细；同时维护独立审查提示语、企业级 SaaS 产品设计、前端结构、状态缓存、I18N、UI 稳定性、可访问性、测试、工具链和性能规则，并优化编号、触发入口、规则路由与协议包升级同步。"
